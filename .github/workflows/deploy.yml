name: Deploy Quest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prepare-env:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .env from GitHub Variables and Secrets
        shell: bash
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=Quest
          APP_ENV=${{ vars.APP_ENV }}
          APP_HOST=${{ vars.APP_HOST }}
          APP_PORT=${{ vars.APP_PORT || '8000' }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}

          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql+psycopg2://${{ vars.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ vars.POSTGRES_DB }}

          CORS_ORIGINS=${{ vars.CORS_ORIGINS }}

          UPLOAD_DIR=${{ vars.UPLOAD_DIR }}
          MAX_UPLOAD_SIZE_MB=${{ vars.MAX_UPLOAD_SIZE_MB }}
          ALLOWED_IMAGE_MIMES=${{ vars.ALLOWED_IMAGE_MIMES }}

          RATE_LIMIT_ENABLED=${{ vars.RATE_LIMIT_ENABLED }}
          RATE_LIMIT_CREATE_PROFILE=${{ vars.RATE_LIMIT_CREATE_PROFILE }}
          RATE_LIMIT_UPLOAD=${{ vars.RATE_LIMIT_UPLOAD }}
          RATE_LIMIT_EDIT=${{ vars.RATE_LIMIT_EDIT }}
          RATE_LIMIT_AUTH=${{ vars.RATE_LIMIT_AUTH || '20/hour' }}

          QUESTIONS_CONFIG_PATH=${{ vars.QUESTIONS_CONFIG_PATH || '/app/config/questions.yaml' }}

          VK_CLIENT_ID=${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET=${{ secrets.VK_CLIENT_SECRET }}
          VK_REDIRECT_URI=${{ vars.VK_REDIRECT_URI || 'https://quest.leonet.site/api/auth/vk/callback' }}
          VK_AUTH_URL=${{ vars.VK_AUTH_URL || 'https://id.vk.com/authorize' }}
          VK_TOKEN_URL=${{ vars.VK_TOKEN_URL || 'https://id.vk.com/oauth2/token' }}
          VK_USERINFO_URL=${{ vars.VK_USERINFO_URL || 'https://id.vk.com/oauth2/user_info' }}

          SESSION_COOKIE_NAME=${{ vars.SESSION_COOKIE_NAME || 'quest_session' }}
          SESSION_TTL_HOURS=${{ vars.SESSION_TTL_HOURS || '168' }}

          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          VITE_PUBLIC_BASE_URL=${{ vars.VITE_PUBLIC_BASE_URL }}
          ENVEOF
          chmod 600 .env

  deploy:
    needs: prepare-env
    uses: leoserverteam/DevOpsTemplates/.github/workflows/fullstack-compose.yml@main
    with:
      project_name: quest
      extra_paths: "backend frontend config nginx data"
    secrets: inherit

  call-nginx:
    needs: deploy
    uses: leoserverteam/DevOpsTemplates/.github/workflows/deploynginx.yml@main
    with:
      conf_source_dir: "./nginx"
    secrets: inherit
