name: Deploy Quest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-quest
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .env from GitHub Variables and Secrets
        shell: bash
        run: |
          cat > .env << 'ENVEOF'
          APP_NAME=Quest
          APP_ENV=${{ vars.APP_ENV }}
          APP_HOST=${{ vars.APP_HOST }}
          APP_PORT=${{ vars.APP_PORT }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}

          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql+psycopg2://${{ vars.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ vars.POSTGRES_DB }}

          CORS_ORIGINS=${{ vars.CORS_ORIGINS }}

          UPLOAD_DIR=${{ vars.UPLOAD_DIR }}
          MAX_UPLOAD_SIZE_MB=${{ vars.MAX_UPLOAD_SIZE_MB }}
          ALLOWED_IMAGE_MIMES=${{ vars.ALLOWED_IMAGE_MIMES }}

          RATE_LIMIT_ENABLED=${{ vars.RATE_LIMIT_ENABLED }}
          RATE_LIMIT_CREATE_PROFILE=${{ vars.RATE_LIMIT_CREATE_PROFILE }}
          RATE_LIMIT_UPLOAD=${{ vars.RATE_LIMIT_UPLOAD }}
          RATE_LIMIT_EDIT=${{ vars.RATE_LIMIT_EDIT }}
          RATE_LIMIT_AUTH=${{ vars.RATE_LIMIT_AUTH }}

          QUESTIONS_CONFIG_PATH=${{ vars.QUESTIONS_CONFIG_PATH }}

          VK_CLIENT_ID=${{ secrets.VK_CLIENT_ID }}
          VK_SERVICE_TOKEN=${{ secrets.VK_SERVICE_TOKEN }}
          VK_REDIRECT_URI=${{ vars.VK_REDIRECT_URI }}

          SESSION_COOKIE_NAME=${{ vars.SESSION_COOKIE_NAME }}
          SESSION_TTL_HOURS=${{ vars.SESSION_TTL_HOURS }}

          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          VITE_PUBLIC_BASE_URL=${{ vars.VITE_PUBLIC_BASE_URL }}
          ENVEOF
          chmod 600 .env

      - name: Deploy to Organization Path
        run: |
          TARGET_DIR="${{ vars.DEPLOY_PATH }}/quest"
          mkdir -p "$TARGET_DIR"
          cp docker-compose.yml "$TARGET_DIR/"
          cp .env "$TARGET_DIR/"
          chmod 600 "$TARGET_DIR/.env"
          for ITEM in backend frontend config nginx data; do
            if [ -e "$ITEM" ]; then
              echo "Copying $ITEM to $TARGET_DIR..."
              cp -r "$ITEM" "$TARGET_DIR/"
            fi
          done
          cd "$TARGET_DIR"
          docker compose down || docker-compose down
          docker compose pull || docker-compose pull
          docker compose up -d --build --remove-orphans || docker-compose up -d --build --remove-orphans

  call-nginx:
    needs: deploy
    uses: leoserverteam/DevOpsTemplates/.github/workflows/deploynginx.yml@main
    with:
      conf_source_dir: "./nginx"
    secrets: inherit
