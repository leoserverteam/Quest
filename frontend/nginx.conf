server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Статика Vite: отдаём как есть
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой маршрут (/create, /edit/:token, /u/:slug) отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
