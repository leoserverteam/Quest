stages:
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"

build:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Building images..."
    - docker build -t quest-backend:$CI_COMMIT_SHA ./backend
    - docker build -t quest-frontend:$CI_COMMIT_SHA ./frontend
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - rsync -az --delete --exclude='.git' --exclude='data/uploads/*' ./ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && docker compose pull || true && docker compose up -d --build && docker image prune -f"
  only:
    - main
