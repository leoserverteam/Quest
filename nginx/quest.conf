# Конфигурация nginx для quest.leonet.site
# Разместить в /etc/nginx/sites-available/quest.leonet.site или подключить
# Не управляем глобальной конфигурацией, только этот файл

server {
    listen 80;
    server_name quest.leonet.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quest.leonet.site;

    # SSL сертификаты управляются Certbot на хосте
    ssl_certificate /etc/letsencrypt/live/quest.leonet.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quest.leonet.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Загрузки
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
